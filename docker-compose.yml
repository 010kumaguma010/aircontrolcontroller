services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - aircon_data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/aircon.db
    networks:
      - aircon_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3030:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aircon_net

networks:
  aircon_net:
    driver: bridge

volumes:
  aircon_data:
